<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sediment — empty window</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack-subset.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../sediment.css">
<link rel="stylesheet" href="samples.css">
</head>
<body data-theme="light">
<div class="page-head"><span class="sd-util">SEDIMENT / DESIGN / EMPTY WINDOW</span><a class="sd-util sd-push" href="index.html">ALL SAMPLES</a></div>
<div class="pair">
<figure>
  <div class="win" data-theme="light">
    <header><svg class="sd-mark" viewBox="0 0 100 100" aria-hidden="true"><polyline points="8,22 50,38 92,22"/><polyline points="8,45 50,61 92,45"/><polyline points="8,68 50,84 92,68"/></svg><span class="sd-wordmark">sediment</span>
      <button class="sd-btn sd-push">Open…</button><button class="sd-btn">Create ZIP</button><span class="sd-select sd-util" tabindex="0">LIGHT</span></header>
    <main>
      <div style="height:30px"></div>
      <span class="sd-util">LOCAL ARCHIVE UTILITY</span>
      <h1 class="sd-display">Less space.<br>Everything in place.</h1>
      <p class="sd-hint" style="margin:0">Drop an archive here, or gather files into a ZIP.</p>
      <div class="sd-row"><button class="sd-btn primary">Open archive…</button><span class="sd-util">ZIP / TAR / TAR.GZ</span></div>
    </main>
    <div class="sd-status"><span class="sd-dot"></span><span class="msg sd-util keep">Ready when you are.</span><button class="sd-btn small">Details</button></div>
  </div>
  <figcaption class="sd-util">LIGHT / 600 × 420</figcaption>
</figure>
<figure>
  <div class="win" data-theme="dark">
    <header><svg class="sd-mark" viewBox="0 0 100 100" aria-hidden="true"><polyline points="8,22 50,38 92,22"/><polyline points="8,45 50,61 92,45"/><polyline points="8,68 50,84 92,68"/></svg><span class="sd-wordmark">sediment</span>
      <button class="sd-btn sd-push">Open…</button><button class="sd-btn">Create ZIP</button><span class="sd-select sd-util" tabindex="0">DARK</span></header>
    <main>
      <div style="height:30px"></div>
      <span class="sd-util">LOCAL ARCHIVE UTILITY</span>
      <h1 class="sd-display">Less space.<br>Everything in place.</h1>
      <p class="sd-hint" style="margin:0">Drop an archive here, or gather files into a ZIP.</p>
      <div class="sd-row"><button class="sd-btn primary">Open archive…</button><span class="sd-util">ZIP / TAR / TAR.GZ</span></div>
    </main>
    <div class="sd-status"><span class="sd-dot"></span><span class="msg sd-util keep">Ready when you are.</span><button class="sd-btn small">Details</button></div>
  </div>
  <figcaption class="sd-util">DARK / 600 × 420</figcaption>
</figure>
</div>
</body>
</html>
