[package]
name = "sediment"
version = "0.1.3"
edition = "2024"
description = "A quiet, local-first archive utility"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]
gui-test = ["gui", "dep:egui_kittest"]

[dependencies]
anyhow = "1"
eframe = { version = "0.36.2", optional = true }
rfd = { version = "0.17.2", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"

clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
ctrlc = "3.4"
libc = "0.2"

egui_kittest = { version = "0.36.2", optional = true, features = ["eframe", "wgpu", "snapshot"] }

[profile.release]
lto = "thin"
strip = true

